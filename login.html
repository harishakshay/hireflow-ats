<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Login · HireFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">

<div class="auth">
    <aside class="auth-art">
        <a class="logo" href="index.html" style="color:#fff"><span class="logo-mark">H</span> HireFlow</a>
        <div>
            <blockquote>Every great team starts with a well-run hiring pipeline.</blockquote>
            <div class="pipeline-art">
                <span>Applied</span><span>Screening</span><span>Interview</span><span>Offer</span><span>Hired ✓</span>
            </div>
        </div>
        <small style="color:#9fc0ae">Applicant Tracking System · Recruiter workspace</small>
    </aside>

    <main class="auth-form">
        <form id="loginForm" novalidate>
            <h1>Welcome back</h1>
            <p class="sub">Sign in to manage jobs, candidates and interviews.</p>
            <div class="form-error hidden" id="loginError"></div>
            <div class="field">
                <label for="email">Work email</label>
                <input id="email" name="email" type="email" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary" style="width:100%" type="submit">Sign in</button>
            <p class="demo-hint">Demo account details are in <b>README.md</b>.</p>
            <p style="margin-top:18px;font-size:14px"><a href="index.html">← Back to careers page</a></p>
        </form>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
